name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ingestion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ingestion/pyproject.toml
      - run: pip install ".[dev]"
      - run: ruff check src tests ../scripts ../platforms
      - run: ruff format --check src tests ../scripts ../platforms
      - run: pytest

  dbt:
    runs-on: ubuntu-latest
    env:
      # Parsing needs these names but never connects to BigQuery.
      GCP_PROJECT_ID: ci-placeholder
      GOOGLE_APPLICATION_CREDENTIALS: /dev/null
      DBT_PROJECT_DIR: dbt
      DBT_PROFILES_DIR: dbt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dbt.txt
      - run: pip install -r requirements-dbt.txt
      - run: dbt deps
      - run: dbt parse
