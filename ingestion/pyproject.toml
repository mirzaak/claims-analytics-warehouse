[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "claims-ingest"
version = "0.1.0"
description = "Loads CMS DE-SynPUF synthetic claims files into a raw warehouse layer."
requires-python = ">=3.11"
dependencies = [
    "google-cloud-bigquery>=3.47,<4",
    "python-dotenv>=1.2,<2",
    "requests>=2.34,<3",
]

[project.optional-dependencies]
snowflake = [
    "snowflake-connector-python>=4.0,<6",
]
dev = [
    "snowflake-connector-python>=4.0,<6",
    "pytest>=9.2,<10",
    "responses>=0.26,<1",
    "ruff>=0.17,<1",
]

[project.scripts]
claims-ingest = "claims_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
